                  error: Password must be 8-16 characters long, include uppercase and lowercase
                    letters, a number, and a special character
                  type: string
                refreshToken:
                  type: string
          text/plain:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
                - refreshToken
              properties:
                oldPassword:
                  minLength: 8
                  maxLength: 16
                  pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]+$
                  error: Password must be 8-16 characters long, include uppercase and lowercase
