      summary: Get list of branches with pagination
      security:
        - bearerAuth: []
      responses:
        "200": {}
    post:
      parameters: []
      operationId: postApiV1Branches
      tags:
        - Branch
      summary: Create a new branch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - address
                - latitude
                - longitude
                - openTime
                - closeTime
              properties:
                name:
                  minLength: 1
                  maxLength: 250
                  error: Branch name must be between 1 and 250 characters
                  type: string
                policy:
                  maxLength: 1000
                  error: Policy must not exceed 1000 characters
                  type: string
                hotline:
                  minLength: 1
                  maxLength: 20
                  error: Hotline must be between 1 and 20 characters
                  type: string
                address:
                  minLength: 1
                  maxLength: 250
                  error: Address must be between 1 and 250 characters
                  type: string
                latitude:
                  minimum: -90
                  maximum: 90
                  error: Latitude must be between -90 and 90
                  type: number
                longitude:
                  minimum: -180
                  maximum: 180
                  error: Longitude must be between -180 and 180
                  type: number
                openTime:
                  pattern: ^([01]?[0-9]|2[0-3]):[0-5][0-9]$
                  error: Time must be in HH:mm format (e.g., 09:00, 18:30)
                  type: string
                closeTime:
                  pattern: ^([01]?[0-9]|2[0-3]):[0-5][0-9]$
                  error: Time must be in HH:mm format (e.g., 09:00, 18:30)
                  type: string
                mapImageId:
                  format: uuid
                  error: Must be a valid UUID
                  type: string
                policyFileId:
                  format: uuid
                  error: Must be a valid UUID
                  type: string
                images:
                  error: Must be an array of valid UUIDs
                  type: array
                  items:
                    format: uuid
                    type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - address
                - latitude
                - longitude
                - openTime
                - closeTime
              properties:
                name:
                  minLength: 1
                  maxLength: 250
                  error: Branch name must be between 1 and 250 characters
                  type: string
                policy:
                  maxLength: 1000
                  error: Policy must not exceed 1000 characters
                  type: string
                hotline:
                  minLength: 1
                  maxLength: 20
                  error: Hotline must be between 1 and 20 characters
                  type: string
                address:
                  minLength: 1
                  maxLength: 250
                  error: Address must be between 1 and 250 characters
                  type: string
                latitude:
                  minimum: -90
                  maximum: 90
                  error: Latitude must be between -90 and 90
                  type: number
                longitude:
                  minimum: -180
                  maximum: 180
                  error: Longitude must be between -180 and 180
                  type: number
                openTime:
                  pattern: ^([01]?[0-9]|2[0-3]):[0-5][0-9]$
                  error: Time must be in HH:mm format (e.g., 09:00, 18:30)
                  type: string
                closeTime:
                  pattern: ^([01]?[0-9]|2[0-3]):[0-5][0-9]$
                  error: Time must be in HH:mm format (e.g., 09:00, 18:30)
                  type: string
                mapImageId:
                  format: uuid
                  error: Must be a valid UUID
                  type: string
                policyFileId:
                  format: uuid
                  error: Must be a valid UUID
                  type: string
                images:
                  error: Must be an array of valid UUIDs
                  type: array
                  items:
                    format: uuid
                    type: string
          text/plain:
            schema:
              type: object
              required:
                - name
                - address
                - latitude
                - longitude
                - openTime
                - closeTime
              properties:
                name:
                  minLength: 1
