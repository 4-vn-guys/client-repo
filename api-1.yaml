openapi: 3.0.3
info:
  title: My API
  description: Elysia API Documentation
  version: 1.0.0
tags:
  - name: Auth
    description: Authentication APIs
  - name: User
    description: User APIs
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
paths:
  /:
    get:
      operationId: getIndex
      responses:
        "200": {}
  /api/v1/health/:
    get:
      operationId: getApiV1Health
      responses:
        "200": {}
  /api/v1/users/{id}:
    get:
      parameters:
        - schema:
            type: string
            uuid: true
          in: path
          name: id
          required: true
      operationId: getApiV1UsersById
      tags:
        - User
      summary: Get user by id
      security:
        - bearerAuth: []
      responses:
        "200": {}
    delete:
      parameters:
        - schema:
            type: string
            uuid: true
          in: path
          name: id
          required: true
      operationId: deleteApiV1UsersById
      tags:
        - User
      summary: Delete user by ID
      security:
        - bearerAuth: []
      responses:
        "200": {}
  /api/v1/users/:
    get:
      parameters:
        - schema:
            minimum: 1
            default: 1
            anyOf:
              - format: integer
                default: 0
                type: string
              - minimum: 1
                default: 1
                type: integer
          in: query
          name: page
          required: false
        - schema:
            minimum: 5
            default: 100
            anyOf:
              - format: integer
                default: 0
                type: string
              - minimum: 5
                default: 100
                type: integer
          in: query
          name: perPage
          required: false
        - schema:
            type: string
            minLength: 1
            maxLength: 250
          in: query
          name: search
          required: false
      operationId: getApiV1Users
      tags:
        - User
      summary: Get list user
      security:
        - bearerAuth: []
      responses:
        "200": {}
    post:
      parameters: []
      operationId: postApiV1Users
      tags:
        - User
      summary: Create owner user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - userName
              properties:
                email:
                  format: email
                  error: Invalid email format
                  type: string
                password:
                  minLength: 8
                  maxLength: 16
                  pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]+$
                  error: Password must be 8-16 characters long, include uppercase and lowercase
                    letters, a number, and a special character
                  type: string
                userName:
                  maxLength: 50
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - password
                - userName
              properties:
                email:
                  format: email
                  error: Invalid email format
                  type: string
                password:
                  minLength: 8
                  maxLength: 16
                  pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]+$
                  error: Password must be 8-16 characters long, include uppercase and lowercase
                    letters, a number, and a special character
                  type: string
                userName:
                  maxLength: 50
                  type: string
          text/plain:
            schema:
              type: object
              required:
                - email
                - password
                - userName
              properties:
                email:
                  format: email
                  error: Invalid email format
                  type: string
                password:
                  minLength: 8
                  maxLength: 16
                  pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]+$
                  error: Password must be 8-16 characters long, include uppercase and lowercase
                    letters, a number, and a special character
                  type: string
                userName:
                  maxLength: 50
                  type: string
      responses:
        "200": {}
  /api/v1/auth/login/email:
