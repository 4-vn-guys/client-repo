                  type: string
                phoneNumber:
                  pattern: ^(0|\+84)[0-9]{9}$
                  error: Phone number must start with '0' or '+84' followed by 9 digits
                  type: string
                password:
                  minLength: 8
                  maxLength: 16
                  pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]+$
                  error: Password must be 8-16 characters long, include uppercase and lowercase
                    letters, a number, and a special character
                  type: string
                userName:
                  minLength: 5
                  maxLength: 50
                  pattern: ^(?!\s*$).+
                  error: Username must be between 5 and 50 characters and cannot be empty
                  type: string
          text/plain:
            schema:
              type: object
              required:
                - password
                - userName
              properties:
                email:
                  format: email
                  error: Invalid email format
                  type: string
                phoneNumber:
                  pattern: ^(0|\+84)[0-9]{9}$
                  error: Phone number must start with '0' or '+84' followed by 9 digits
                  type: string
                password:
                  minLength: 8
                  maxLength: 16
                  pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]+$
                  error: Password must be 8-16 characters long, include uppercase and lowercase
                    letters, a number, and a special character
                  type: string
                userName:
                  minLength: 5
                  maxLength: 50
                  pattern: ^(?!\s*$).+
                  error: Username must be between 5 and 50 characters and cannot be empty
                  type: string
      responses:
        "200": {}
  /api/v1/auth/me:
