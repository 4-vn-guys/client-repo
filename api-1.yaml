        - Auth
      summary: Login with Google
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idToken
              properties:
                idToken:
                  minLength: 1
                  type: string
              additionalProperties: false
      responses:
        "200": {}
  /api/v1/auth/login/phone-number:
    post:
      parameters: []
      operationId: postApiV1AuthLoginPhone-number
      tags:
        - Auth
      summary: Login with phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phoneNumber
                - password
              properties:
                phoneNumber:
                  pattern: ^(0|\+84)[0-9]{9}$
                  error: Phone number must start with '0' or '+84' followed by 9 digits
                  type: string
                password:
                  minLength: 8
                  maxLength: 16
                  pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]+$
                  error: Password must be 8-16 characters long, include uppercase and lowercase
